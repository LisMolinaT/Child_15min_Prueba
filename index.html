<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Accesibilidad infantil</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    html, body { height:100%; margin:0; font-family:Arial, sans-serif; }
    #app { display:grid; grid-template-columns:390px 1fr; height:100%; }
    #panel {
      background:#1f2937; color:#fff; padding:18px; overflow:auto;
      box-sizing:border-box;
    }
    #map { width:100%; height:100%; background:#e5e7eb; }
    h1 { margin:0 0 16px; font-size:24px; }
    label { display:block; font-weight:700; margin-bottom:7px; }
    select {
      width:100%; padding:12px; border-radius:9px; border:1px solid #cbd5e1;
      font-size:16px; margin-bottom:18px;
    }
    .legend-title { font-weight:700; margin-bottom:8px; }
    .legend-row { display:flex; align-items:center; gap:10px; margin:8px 0; }
    .swatch { width:30px; height:16px; border-radius:2px; border:1px solid rgba(255,255,255,.25); }
    .hint { margin-top:18px; color:#d1d5db; line-height:1.4; font-size:14px; }
    .card {
      margin-top:18px; padding:14px; border-radius:9px; background:#111827;
    }
    .card h2 { margin:0 0 4px; font-size:18px; }
    #coords { color:#cbd5e1; font-size:13px; margin-bottom:10px; }
    .value-row { display:flex; justify-content:space-between; gap:12px; padding:6px 0; }
    .status {
      margin-top:12px; padding:10px 12px; border-radius:7px;
      background:#0f172a; color:#cbd5e1; font-size:13px;
    }
    .leaflet-control-attribution { font-size:10px; }

    @media (max-width: 780px) {
      #app { grid-template-columns:1fr; grid-template-rows:auto 68vh; height:auto; min-height:100%; }
      #panel { overflow:visible; }
      #map { min-height:68vh; }
    }
  </style>
</head>
<body>
<div id="app">
  <aside id="panel">
    <h1>Accesibilidad infantil</h1>

    <label for="layerSelect">Oportunidad urbana</label>
    <select id="layerSelect">
      <option value="river">River</option>
      <option value="epa">EPA</option>
      <option value="zoo">Zoo</option>
    </select>

    <div class="legend-title">Tiempo caminando (min)</div>
    <div class="legend-row"><span class="swatch" style="background:#24449a"></span><span>0–15</span></div>
    <div class="legend-row"><span class="swatch" style="background:#3478d7"></span><span>15–30</span></div>
    <div class="legend-row"><span class="swatch" style="background:#58b9c6"></span><span>30–45</span></div>
    <div class="legend-row"><span class="swatch" style="background:#a6ddb3"></span><span>45–60</span></div>
    <div class="legend-row"><span class="swatch" style="background:#fff7bc"></span><span>60–120</span></div>

    <div class="hint">Haz clic en el mapa para consultar los tres tiempos en ese punto.</div>

    <div class="card">
      <h2>Punto seleccionado</h2>
      <div id="coords">Sin seleccionar</div>
      <div class="value-row"><span>River</span><strong id="riverVal">—</strong></div>
      <div class="value-row"><span>EPA</span><strong id="epaVal">—</strong></div>
      <div class="value-row"><span>Zoo</span><strong id="zooVal">—</strong></div>
    </div>

    <div class="status" id="status">Cargando mapas…</div>
  </aside>

  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/georaster"></script>
<script src="https://unpkg.com/georaster-layer-for-leaflet"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.11.0/proj4.js"></script>

<script>
(function () {
  const urls = {
    river: "https://raw.githubusercontent.com/LisMolinaT/Child_15min_Prueba/main/def_3eR_Dual_SubcatOpport_e93c36_1_river_e93bae_P50_C1.dual_COG.tif",
    epa: "https://raw.githubusercontent.com/LisMolinaT/Child_15min_Prueba/main/def_3eR_Dual_SubcatOpport_e93c36_2_3_epa_e93bcc_P50_C1.dual_COG.tif",
    zoo: "https://raw.githubusercontent.com/LisMolinaT/Child_15min_Prueba/main/def_3eR_Dual_SubcatOpport_e93c36_5_zoo_e93b9b_P50_C1.dual_COG.tif"
  };

  // Support for WGS84 / UTM 17S if needed.
  proj4.defs("EPSG:32717", "+proj=utm +zone=17 +south +datum=WGS84 +units=m +no_defs");
  proj4.defs("EPSG:4326", "+proj=longlat +datum=WGS84 +no_defs");

  const map = L.map("map").setView([-2.90, -78.99], 11);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap contributors"
  }).addTo(map);

  const rasters = {};
  const layers = {};
  let activeKey = "river";
  let marker = null;

  function colorFor(v) {
    if (v == null || Number.isNaN(v)) return null;
    if (v < 15) return "#24449a";
    if (v < 30) return "#3478d7";
    if (v < 45) return "#58b9c6";
    if (v < 60) return "#a6ddb3";
    if (v < 120) return "#fff7bc";
    return null;
  }

  async function loadOne(key) {
    const response = await fetch(urls[key]);
    if (!response.ok) throw new Error(key + ": HTTP " + response.status);
    const arrayBuffer = await response.arrayBuffer();
    const raster = await parseGeoraster(arrayBuffer);
    rasters[key] = raster;

    layers[key] = new GeoRasterLayer({
      georaster: raster,
      opacity: 0.68,
      resolution: 256,
      pixelValuesToColorFn: values => colorFor(Number(values[0]))
    });
  }

  async function initialize() {
    const status = document.getElementById("status");
    try {
      await Promise.all([loadOne("river"), loadOne("epa"), loadOne("zoo")]);

      layers.river.addTo(map);
      map.fitBounds(layers.river.getBounds(), { padding:[20,20] });

      status.textContent = "Listo. Selecciona una oportunidad o haz clic en el mapa.";
    } catch (err) {
      console.error(err);
      status.textContent = "Error al cargar los COG. Abre F12 → Console y envíame el mensaje de error.";
    }
  }

  function showLayer(key) {
    Object.keys(layers).forEach(k => {
      if (map.hasLayer(layers[k])) map.removeLayer(layers[k]);
    });
    layers[key].addTo(map);
    activeKey = key;
  }

  document.getElementById("layerSelect").addEventListener("change", function (e) {
    if (layers[e.target.value]) showLayer(e.target.value);
  });

  function getRasterCRS(raster) {
    const p = String(raster.projection || "").toUpperCase();
    if (p.includes("32717") || p === "32717") return "EPSG:32717";
    if (p.includes("4326") || p === "4326") return "EPSG:4326";
    return null;
  }

  function valueAt(raster, lat, lng) {
    let x = lng, y = lat;
    const crs = getRasterCRS(raster);

    if (crs && crs !== "EPSG:4326") {
      [x, y] = proj4("EPSG:4326", crs, [lng, lat]);
    }

    const xmin = raster.xmin, xmax = raster.xmax;
    const ymin = raster.ymin, ymax = raster.ymax;

    if (x < xmin || x > xmax || y < ymin || y > ymax) return null;

    const px = Math.floor((x - xmin) / raster.pixelWidth);
    const py = Math.floor((ymax - y) / raster.pixelHeight);

    if (px < 0 || py < 0 || px >= raster.width || py >= raster.height) return null;

    const band = raster.values && raster.values[0];
    if (!band || !band[py]) return null;

    const v = Number(band[py][px]);
    if (!Number.isFinite(v)) return null;

    const nd = raster.noDataValue;
    if (nd !== undefined && nd !== null && v === Number(nd)) return null;
    if (v >= 120) return null;

    return v;
  }

  map.on("click", function (e) {
    const { lat, lng } = e.latlng;

    if (marker) marker.remove();
    marker = L.circleMarker([lat, lng], {
      radius:6, weight:2, fillOpacity:1
    }).addTo(map);

    document.getElementById("coords").textContent =
      lat.toFixed(5) + ", " + lng.toFixed(5);

    ["river","epa","zoo"].forEach(key => {
      const value = valueAt(rasters[key], lat, lng);
      document.getElementById(key + "Val").textContent =
        value == null ? "Sin dato" : value.toFixed(1) + " min";
    });
  });

  initialize();
})();
</script>
</body>
</html>
